# ==============================================================================
# Configuración de Red de Casa — Ohana POS
# ==============================================================================
# Este archivo ayuda al sistema a detectar si se está ejecutando en la red de
# casa para habilitar conexiones directas sin necesidad del túnel Cloudflare.

# El prefijo de la red Wi-Fi de tu casa
HOME_NETWORK_PREFIX=192.168.1

# La IP actual de este servidor Windows en tu casa
# (Actualízala aquí si el router te asigna una IP diferente en el futuro)
HOME_SERVER_IP=192.168.1.9

# Puertos
HOME_BACKEND_PORT=8000
HOME_FRONTEND_PORT=5173
